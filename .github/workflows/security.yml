# M11.3: dependency audits and static security checks. High-severity findings fail the run.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.11" }
      - run: uv sync --frozen
      - name: Static checks (ruff's bandit rules, S)
        run: uv run ruff check --select S src
      - name: Known vulnerabilities in locked dependencies
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --frozen --no-hashes --no-dev)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (high and critical)
        run: pnpm audit --audit-level high --prod

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
