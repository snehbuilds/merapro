[project]
name = "mera"
version = "0.1.0"
description = "Mera: AI-assisted multi-account social publishing with hash-bound approvals."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "procrastinate>=3.0",
  "structlog>=24.1",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "email-validator>=2.2",
  "cryptography>=43",
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "trafilatura>=2.0",
  "litellm>=1.60",
  "pgvector>=0.3.6",
  "py3langid>=0.3",
  "truststore>=0.10",
  "pillow>=13.0.0",
  "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mera"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored third-party skills are checksum-pinned; no tool may rewrite them.
extend-exclude = ["src/mera/skills/platforms"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "S608"]  # DDL built from constants
"tests/**" = ["S105", "S106", "PT012", "F811", "RUF001"]  # F811: pytest fixtures imported for reuse

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

# Strict where correctness is load-bearing (docs/10 §2).
[[tool.mypy.overrides]]
module = ["mera.domain.*", "mera.application.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs Docker (testcontainers Postgres)",
]

[tool.coverage.run]
source = ["mera"]
branch = true
# SQLAlchemy async resumes code inside greenlets; without this, lines after awaits
# are under-reported.
concurrency = ["thread", "greenlet"]
